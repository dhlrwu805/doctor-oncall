  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1c2a4a; touch-action: manipulation; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
  #rotate { display: none; position: fixed; inset: 0; z-index: 999; background: #bff0ff; color: #2b3a6b; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; font-family: "Jua", sans-serif; font-size: 22px; }
  #rotate .ic { font-size: 70px; animation: turn 1.6s ease-in-out infinite; }
  @keyframes turn { 50% { transform: rotate(90deg); } }
  @media (orientation: portrait) and (max-width: 900px) and (hover: none) and (pointer: coarse) { #rotate { display: flex; } }
  #wrap { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; transform: translate(-50%, -50%) scale(var(--s, 1)); }
  #stage { position: relative; width: 1280px; height: 720px; overflow: hidden; font-family: "Kkakdugi", "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: #3a2a55; }
  .layer { position: absolute; inset: 0; }
  .hidden { display: none !important; }
  button { font-family: inherit; cursor: pointer; color: inherit; }
  #bg { image-rendering: crisp-edges; image-rendering: pixelated; background-size: cover; background-position: center; }

  /* 공통 */
  .pill { border: 4px solid #3a2a55; border-radius: 40px; box-shadow: 0 5px 0 #3a2a55, inset 0 8px 0 rgba(255,255,255,.45), inset 0 -6px 0 rgba(0,0,0,.08); font-size: 26px; padding: 10px 30px; transition: transform .1s; }
  .pill:active { transform: translateY(4px); box-shadow: 0 1px 0 #3a2a55; }
  .pink { background: #ff6fae; color: #fff; text-shadow: 0 2px 0 #c4357a; }
  .yellow { background: #ffd84d; }
  .blue { background: #6fd0ff; }
  .mint { background: #7fe3b0; }
  .card { background: #fff; border: 5px solid #3a2a55; border-radius: 28px; box-shadow: 0 8px 0 #3a2a55; padding: 26px 34px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .tag { padding: 3px 18px; border-radius: 18px; background: #ff6fae; color: #fff; border: 3px solid #3a2a55; font-size: 18px; }
  .card h2 { margin: 0; font-size: 36px; color: #e23d86; }
  .card p { margin: 0; font-size: 21px; line-height: 1.6; }
  .modal { z-index: 60; display: flex; align-items: center; justify-content: center; background: rgba(30,30,70,.45); }
  .sticker { filter: drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff) drop-shadow(0 5px 6px rgba(0,0,0,.2)); }

  /* 타이틀 */
  #title { z-index: 50; }
  #logo { position: absolute; left: 70px; top: 50px; transform: rotate(-3deg); }
  #logo div { font-family: "Lilita One", "Jua", sans-serif; font-size: 116px; line-height: .95; -webkit-text-stroke: 12px #3a2a55; paint-order: stroke fill; text-shadow: 0 8px 0 #3a2a55; }
  #logo .l1 { color: #ffd84d; } #logo .l2 { color: #ff6fae; margin-left: 30px; }
  #titleSub { position: absolute; left: 86px; top: 300px; padding: 8px 24px; font-size: 24px; background: #fff; border: 4px solid #3a2a55; border-radius: 30px; }
  #titleMenu { position: absolute; left: 86px; top: 380px; display: flex; flex-direction: column; gap: 18px; width: 330px; }
  #titleMenu .pill { width: 100%; }
  #titleChars { position: absolute; right: 40px; bottom: 70px; display: flex; align-items: flex-end; gap: 0; }
  #titleChars img { height: 330px; animation: bob 2.4s ease-in-out infinite; }
  #titleChars img:nth-child(2) { height: 370px; animation-delay: .4s; }
  #titleChars img:nth-child(3) { animation-delay: .8s; }
  #disclaimer { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font-size: 15px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  @keyframes bob { 50% { transform: translateY(-10px); } }

  /* 인게임 HUD */
  #top { position: absolute; top: 16px; left: 16px; right: 16px; z-index: 10; display: flex; gap: 12px; align-items: center; }
  .chip { background: #fff; border: 4px solid #3a2a55; border-radius: 26px; box-shadow: 0 4px 0 #3a2a55; padding: 6px 20px; font-size: 24px; }
  #dday { background: #fff4c2; }
  #statPanel { position: absolute; left: 16px; top: 86px; width: 300px; z-index: 10; padding: 16px 18px; background: rgba(255,255,255,.93); border: 4px solid #3a2a55; border-radius: 24px; box-shadow: 0 5px 0 #3a2a55; }
  .stat { display: flex; align-items: center; gap: 8px; font-size: 19px; margin-bottom: 8px; }
  .stat .nm { width: 86px; } .stat .v { width: 34px; text-align: right; font-size: 17px; }
  .bar { flex: 1; height: 14px; border-radius: 8px; background: #e6e3f2; border: 2px solid #3a2a55; overflow: hidden; }
  .bar div { height: 100%; transition: width .6s; }
  #moodLabel { font-size: 14px; color: #e23d86; margin: -4px 0 8px 94px; height: 18px; }
  #fans { margin-top: 6px; padding-top: 10px; border-top: 3px dashed #d9d3ea; font-size: 22px; text-align: center; }

  #charWrap { position: absolute; left: 50%; bottom: 74px; transform: translateX(-56%); z-index: 5; text-align: center; }
  #charImg { height: 400px; image-rendering: auto; filter: drop-shadow(0 6px 4px rgba(0,0,0,.25)); animation: bob 2.6s ease-in-out infinite; }
  #charImg.jump { animation: jump .6s ease-out; }
  @keyframes jump { 30% { transform: translateY(-50px) scale(1.04); } 60% { transform: translateY(0); } 75% { transform: translateY(-14px); } }
  #bubble { position: absolute; left: 62%; top: 10px; z-index: 6; background: #fff; border: 4px solid #3a2a55; border-radius: 30px; padding: 8px 18px; font-size: 40px; opacity: 0; transition: opacity .3s; }
  #bubble::after { content: ""; position: absolute; left: 18px; bottom: -16px; border: 9px solid transparent; border-top-color: #3a2a55; }
  #bubble.show { opacity: 1; }
  #bubble.talk { font-size: 23px; width: max-content; max-width: 230px; white-space: normal; word-break: keep-all; text-align: center; line-height: 1.3; padding: 10px 16px; font-weight: 700; color: #3a2a55; left: auto; right: 74%; top: 30px; }
  #bubble.talk::after { left: auto; right: 18px; }
  .bossSay { display: flex; align-items: center; gap: 10px; background: #f3efff; border: 3px solid #3a2a55; border-radius: 18px; padding: 6px 16px 6px 8px; margin: 4px auto; width: fit-content; max-width: 760px; }
  .bossSay img { height: 64px; image-rendering: pixelated; }
  .bossSay span { font-size: 22px; text-align: left; }
  .bossSay small { display: block; font-size: 14px; color: #7a6a95; }
  #nameplate { display: inline-block; margin-top: -6px; padding: 4px 18px; background: #3a2a55; color: #fff; border-radius: 16px; font-size: 18px; }

  #panel { position: absolute; right: 16px; top: 86px; width: 400px; z-index: 10; padding: 16px; background: rgba(255,255,255,.93); border: 4px solid #3a2a55; border-radius: 24px; box-shadow: 0 5px 0 #3a2a55; }
  #panel h3 { margin: 0 0 10px; font-size: 22px; font-weight: normal; text-align: center; }
  #schedGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  #mission { background: #fff4c2; border: 3px solid #3a2a55; border-radius: 14px; padding: 6px 10px; font-size: 16px; margin-bottom: 10px; text-align: center; }
  #slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
  .slot { border: 3px dashed #b9b0d0; border-radius: 14px; height: 84px; background: #f7f5ff; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 14px; line-height: 1.25; cursor: pointer; text-align: center; padding: 2px; }
  .slot b { font-size: 26px; font-weight: normal; }
  .slot .wk { font-size: 11px; color: #7a6a95; }
  .slot.filled { border-style: solid; border-color: #3a2a55; background: #fff; }
  .slot.sel { border-color: #ff4f9a; border-style: solid; box-shadow: 0 0 0 3px #ffc2dc; }
  .slot.lock { background: #ffe0ef; border-style: solid; border-color: #ff9ac6; }
  .slot.done { background: #e3f8e8; }

  rhythm(area, opt, finish) {

    let hit = 0, miss = 0, res = 0, ended = false; const start = performance.now();
    const judge = (txt, col) => { const j = $("rhJudge"); j.textContent = txt; j.style.color = col; j.classList.remove("show"); void j.offsetWidth; j.classList.add("show"); };
    const resolve = (n, ok, txt) => { n.done = true; res++; if (n.el) n.el.remove(); if (ok) { hit++; judge(txt, "#ffd84d"); sfx("pop"); } else { miss++; judge("MISS", "#9fb4ff"); }
      $("rhHit").textContent = hit; $("rhMiss").textContent = miss; $("rhLeft").textContent = N - res; };

          n.el.style.top = hitY * (1 - (n.t - now) / FALL) - 7 + "px"; } }

    const map = { d: 0, f: 1, j: 2 }; miniKey = e => { const k = e.key.toLowerCase(); if (k in map && !e.repeat) { e.preventDefault(); tap(map[k]); } };

  },
  dance(area, opt, finish) {

  sauce(area, opt, finish) {

/* ---------- 🏥 대형 수술 (최종 보스) ---------- */

    sayC(`📈 모니터 · 위기 ${T.r + 1}/${cs.crises.length}`, `<b>${c.mon}</b><br>${c.q}${hint}`, "judge");
    let list = c.opts.map((o, i) => ({ ...o, i }));

    <div class="album">${pics.map(p => `<div class="pola"><div class="ph" style="background:${SEASON_BG[p.season]}"><span class="e">${p.icon}</span><img src="${OUTFITS.find(o => o.id === p.outfit).img}"></div><div>${p.title}</div><small style="color:#7a6a95">${p.cap}</small></div>`).join("")}</div>
    ${gr ? `<p style="font-size:24px;margin:4px"><b>${gr.title}</b></p>` : ""}<p style="font-size:18px">📸 챙긴 추억 ${S.album.length}개 · 🏥 평판 ${S.fans.toLocaleString()} · 👗 의상 ${OUTFITS.filter(isUnlocked).length}/${OUTFITS.length}</p>
    <button class="pill pink" onclick="location.reload()">처음으로</button>`;
}

/* ---------- 타이틀 ---------- */
$("logo1").textContent = CONFIG.logo[0]; $("logo2").textContent = CONFIG.logo[1]; $("titleSub").textContent = CONFIG.subtitle;
$("titleChars").innerHTML = OUTFITS.slice(0, 3).map(o => `<img src="${o.img}" alt="">`).join("");
$("bg").style.backgroundImage = `url(${drawBg("spring")})`;
["top", "statPanel", "charWrap", "panel", "bottom"].forEach(id => $(id).classList.add("hidden"));
if (!store.get(SAVE)) $("contBtn").style.opacity = .4;
function startGame() {
  $("title").classList.add("hidden");
  ["top", "statPanel", "charWrap", "panel", "bottom"].forEach(id => $(id).classList.remove("hidden"));
  buildSchedule(); bubble("👋");
  if (S.week === 0 && S.planMonth === -1) {
    render();
    popup(`<div class="tag">WELCOME</div><div id="popIcon">🌅</div><h2>마취과 1년 차, 첫 출근!</h2><p>올해 목표는 <b>연말 평가 S등급</b>!<br>매달 4주치 업무를 짜고 <b>▶ 이번 달 시작</b>을 눌러요.<br>같은 업무만 반복하면 질려요 😮‍💨 · 순서를 잘 짜면 <b>콤보</b>가 터져요 ✨<br>중간중간 이벤트 미션이 터지고, 11월엔 VIP 대형 수술이 있어요 🏥<br>체력이 0이 되면 과로로 쓰러져요 🤒</p>`, [{ t: "시작! ▶", fn: beginMonth }]);
  } else beginMonth();
  try { const el = document.documentElement, p = el.requestFullscreen ? el.requestFullscreen() : null; if (p && p.then) p.then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock("landscape").catch(() => {})).catch(() => {}); } catch (e) {}
}
$("newBtn").onclick = () => {
  $("popCard").innerHTML = `<div class="tag">NEW GAME</div><h2>전공의 이름을 알려 주세요</h2><p>구서대학교병원 마취과, ${CONFIG.boss} 밑에서 1년을 버텨 봐요 🩺</p>
    <input id="mgrInput" maxlength="8" placeholder="이름 입력" style="width:300px;padding:12px;font-size:26px;font-family:inherit;text-align:center;border:4px solid #c9c2de;border-radius:18px;outline:none">
    <div style="display:flex;gap:14px"><button class="pill yellow" id="mBack">뒤로</button><button class="pill pink" id="mGo">시작!</button></div>`;
  $("pop").classList.remove("hidden");
  $("mBack").onclick = () => $("pop").classList.add("hidden");
  $("mGo").onclick = () => { S = newState($("mgrInput").value.trim() || "김"); $("pop").classList.add("hidden"); store.set(SAVE, S); startGame(); if (window._nameEgg) _nameEgg(); };
  $("mgrInput").onkeydown = e => { if (e.key === "Enter") $("mGo").click(); };
};
$("contBtn").onclick = () => { const s = store.get(SAVE); if (!s) return toast("저장된 게임이 없어요"); S = Object.assign(newState(s.mgr), s); if (S.planMonth === undefined) S.planMonth = -1; startGame(); };
$("awardDexBtn").onclick = () => {
  const dex = store.get(DEX) || [];
  openModal(`<div class="tag">COLLECTION</div><h2>📋 평가 도감 ${dex.length}/${AWARDS.length}</h2>
    <div style="display:grid;grid-template-columns:repeat(2,300px);gap:10px">${AWARDS.map(a => `<div class="award show" style="font-size:22px;${dex.includes(a.id) ? "" : "background:#eee;color:#aaa"}">${dex.includes(a.id) ? a.icon + " " + a.name : "🔒 ???"}</div>`).join("")}</div>`);
};
</script>

</body>
</html>
